services:
  1min-bridge:
    image: ghcr.io/binuengoor/1min-bridge:latest
    container_name: 1min-bridge
    ports:
      - "3000:3000"
    environment:
      # Optional: server-side default API key (clients can still override via Authorization header)
      # - ONE_MIN_API_KEY=your_1min_api_key
      # Optional: restrict to specific models (comma-separated)
      # - ALLOWED_MODELS=gpt-5,claude-sonnet-4-5-20250929,gemini-2.5-pro
      # Optional: cache TTL in ms (default 1800000 = 30 min)
      # - CACHE_TTL_MS=1800000
      # Optional: log level (debug, info, warn, error)
      # - LOG_LEVEL=info
      # Optional: Automated Daily Check-in (15,000 free credits/day)
      # - CHECKIN_ENABLED=true
      # - CHECKIN_EMAIL=your_email@example.com
      # - CHECKIN_PASSWORD=your_password
      # - CHECKIN_TOTP_SECRET=your_totp_secret_if_2fa_enabled
      # - CHECKIN_UTC_HOUR=8 # 08:00 UTC = 00:00 PST (1min.ai daily reset)
      # - CHECKIN_TELEGRAM_BOT_TOKEN=123456:ABC-DEF...
      # - CHECKIN_TELEGRAM_CHAT_ID=123456789
      # - CHECKIN_WEBHOOK_URL=https://discord.com/api/webhooks/...
      # Optional: 30-day Lifetime Credit Keep-Alive (prevents losing 2M monthly credits)
      # - CHECKIN_KEEP_ALIVE_ENABLED=true
      # - CHECKIN_KEEP_ALIVE_DAYS=7
      # - CHECKIN_KEEP_ALIVE_MODEL=qwen3.7-flash
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
